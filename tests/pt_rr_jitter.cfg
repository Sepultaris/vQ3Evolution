// Consecutive stationary frames expose reconstruction motion hidden by stills.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
wait 80
setviewpos -1510 200 24 0
wait 64
viewpos
echo PT_JITTER_STATIONARY_BEGIN
screenshotJPEG jitter_00
wait 2
screenshotJPEG jitter_01
wait 2
screenshotJPEG jitter_02
wait 2
screenshotJPEG jitter_03
wait 2
screenshotJPEG jitter_04
wait 2
screenshotJPEG jitter_05
wait 2
screenshotJPEG jitter_06
wait 2
screenshotJPEG jitter_07
wait 2
screenshotJPEG jitter_08
wait 2
screenshotJPEG jitter_09
wait 2
screenshotJPEG jitter_10
wait 2
screenshotJPEG jitter_11
wait 2
screenshotJPEG jitter_12
wait 2
screenshotJPEG jitter_13
wait 2
screenshotJPEG jitter_14
wait 2
screenshotJPEG jitter_15
wait 2
pt_info
echo PT_PROGRAM_COMPLETE
quit
