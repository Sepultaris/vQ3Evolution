// Run only with an isolated fs_homepath. This is a visual/synchronization check.
set cg_draw2D 1
set cg_draw3dIcons 1
set cg_drawGun 1
set cg_bobup 0
set cg_bobpitch 0
set cg_bobroll 0
set con_notifytime 0
set cl_yawspeed 90
wait 40
setviewpos -1616 200 24 0
wait 10
set r_rayTracingShadowStrength 0
wait 4
screenshotJPEG sw_off
wait 2
set r_rayTracingShadowStrength 0.55
wait 4
screenshotJPEG sw_on
+right
wait 30
-right
wait 4
screenshotJPEG sw_turn
wait 5
vid_restart
wait 40
screenshotJPEG sw_restart
wait 5
disconnect
wait 15
echo SOFTWARE_RT_SMOKE_COMPLETE
quit
