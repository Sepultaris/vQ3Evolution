// One-shot injected WSI results exercise real frame cleanup and engine restart.
// Run with developer 1 on devmap; not proof of an actual OS surface-loss event.
set fixedtime 0
set com_maxfps 60
set com_maxfpsUnfocused 60
set com_maxfpsMinimized 60
set cg_draw2D 1
set cg_drawGun 1
set con_notifytime 0
set r_pathTracingReference 0
set r_pathTracingSamples 4
set r_pathTracingBounces 4
wait 240
echo PT_RECOVERY_BEGIN_0
vk_testRecovery acquire-out-of-date
wait 240
pt_info
echo PT_RECOVERY_END_0
echo PT_RECOVERY_BEGIN_1
vk_testRecovery acquire-surface-lost
wait 240
pt_info
echo PT_RECOVERY_END_1
echo PT_RECOVERY_BEGIN_2
vk_testRecovery acquire-timeout
wait 240
pt_info
echo PT_RECOVERY_END_2
echo PT_RECOVERY_BEGIN_3
vk_testRecovery acquire-not-ready
wait 240
pt_info
echo PT_RECOVERY_END_3
echo PT_RECOVERY_BEGIN_4
vk_testRecovery acquire-suboptimal
wait 240
pt_info
echo PT_RECOVERY_END_4
echo PT_RECOVERY_BEGIN_5
vk_testRecovery present-out-of-date
wait 240
pt_info
echo PT_RECOVERY_END_5
echo PT_RECOVERY_BEGIN_6
vk_testRecovery present-surface-lost
wait 240
pt_info
echo PT_RECOVERY_END_6
echo PT_RECOVERY_BEGIN_7
vk_testRecovery present-suboptimal
wait 240
pt_info
echo PT_RECOVERY_END_7
echo PT_RECOVERY_COMPLETE
quit
