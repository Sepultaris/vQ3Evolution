// Live console control at fixed saved quality; no UI or persistent changes.
set fixedtime 16
set con_notifytime 0
wait 48
noclip
setviewpos -1152 -1200 24 270
r_pathTracingAmbient 0
wait 48
echo PT_AMBIENT_OFF
pt_info
screenshot ambient_off
wait 4
r_pathTracingAmbient 0.15
wait 48
echo PT_AMBIENT_ON
pt_info
screenshot ambient_on
wait 4
r_pathTracingAmbient 0
wait 48
echo PT_AMBIENT_RESTORED
pt_info
screenshot ambient_restored
wait 4
echo PT_PROGRAM_COMPLETE
quit
