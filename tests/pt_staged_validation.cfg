// Same-frame raw four-channel comparison; no quality settings changed.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
set r_pathTracingReference 0
set r_pathTracingBRDFReuse 1
set r_pathTracingLightLoop 1
set r_pathTracingMaterialCache 1
set r_pathTracingEmitterGeometry 1
set r_pathTracingCompactTransport 1
set r_pathTracingStaged 0
wait 16
setviewpos -1616 200 24 0
wait 20
set r_pathTracingStaged 2
wait 12
echo PT_CACHE_STATIONARY
pt_info
screenshotJPEG staged_validation_stationary
setviewpos -1510 200 24 70
wait 12
echo PT_CACHE_MOVED
screenshotJPEG staged_validation_moved
set r_pathTracingStaged 0
wait 8
echo PT_CACHE_COMPLETE
quit
