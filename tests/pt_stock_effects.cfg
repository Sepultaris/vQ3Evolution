// Stock q3dm6 armor models and the real quad weapon aura, at saved quality.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
wait 80
noclip
setviewpos 256 -1220 208 270
wait 64
viewpos
echo PT_STOCK_YELLOW_ARMOR
screenshot stock_yellow_armor
wait 4
setviewpos -1600 448 528 0
wait 64
viewpos
echo PT_STOCK_RED_ARMOR
screenshot stock_red_armor
wait 4
setviewpos -1510 200 24 0
wait 48
screenshot stock_before_quad
wait 4
give Quad Damage
wait 32
echo PT_STOCK_QUAD_WEAPON
screenshot stock_quad_weapon
wait 8
set r_pathTracingDebug 4
wait 8
screenshot stock_quad_normals
wait 4
set r_pathTracingDebug 0
pt_info
echo PT_PROGRAM_COMPLETE
quit
