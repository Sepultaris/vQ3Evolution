// Identical camera poses, comparing diffuse and reflection history acceptance.
set fixedtime 16
set con_notifytime 0
set cg_draw2D 0
set cg_drawGun 0
set r_pathTracingReference 0
set r_pathTracingDebug 0
set r_pathTracingTemporal 1
set r_pathTracingDenoise 1
set r_pathTracingSamples 2
set r_pathTracingBounces 4
set r_pathTracingExposure 8
set r_pathTracingHistory 8
set cl_yawspeed 45
wait 80
setviewpos -1616 200 24 0
wait 80
set r_pathTracingTemporalDebug 1
+right
wait 20
screenshotJPEG pt_split_diffuse_history
-right
wait 4
setviewpos -1616 200 24 0
wait 80
set r_pathTracingTemporalDebug 2
+right
wait 20
screenshotJPEG pt_split_reflection_history
-right
wait 4
set r_pathTracingTemporalDebug 0
quit
