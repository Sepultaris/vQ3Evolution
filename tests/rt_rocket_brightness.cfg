// Real flying rocket, slow fixed simulation for live emission-control captures.
set fixedtime 100
set sv_fps 125
set con_notifytime 0
set cg_noProjectileTrail 1
set r_muzzleFlashBrightness 0
set r_muzzleFlashLightScale 0
cmd setviewpos -208 448 24 0
wait 10
give "Rocket Launcher"
god
wait 10
weapon 5
wait 80
set fixedtime 16
+attack
wait 12
-attack
set fixedtime 1
r_rocketBrightness 1
r_rocketLightScale 1
wait 8
pt_info
screenshotJPEG rocket_default
wait 2
r_rocketBrightness 0
wait 8
pt_info
screenshotJPEG rocket_hidden_lit
wait 2
r_rocketBrightness 1
r_rocketLightScale 0
wait 8
pt_info
screenshotJPEG rocket_visible_unlit
wait 2
r_rocketBrightness 0
wait 8
pt_info
screenshotJPEG rocket_both_off
wait 2
r_rocketBrightness .25
r_rocketLightScale .25
wait 8
pt_info
screenshotJPEG rocket_dim
wait 2
writeconfig rocket-controls-check.cfg
echo SOFTWARE_LIGHTING_ROCKET_COMPLETE
wait 4
quit
