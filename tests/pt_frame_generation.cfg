// Exercise real presentations at a controlled rate, with static and moving views.
set fixedtime 0
set com_maxfps 60
set com_maxfpsUnfocused 60
set com_maxfpsMinimized 60
set cg_draw2D 1
set cg_drawGun 1
set con_notifytime 0
set r_pathTracingReference 0
set r_pathTracingSamples 4
set r_pathTracingBounces 4
set r_pathTracingDenoise 1
set r_pathTracingTemporal 1
wait 120
echo PT_FG_BASELINE
nvidia_info
wait 240
echo PT_FG_STATIC
nvidia_info
+right
wait 240
-right
echo PT_FG_MOVING
nvidia_info
quit
