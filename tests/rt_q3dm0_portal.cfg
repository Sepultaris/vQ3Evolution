// Native camera portal and adjacent mirror, with isolated test settings.
set fixedtime 16
set con_notifytime 0
set cg_drawGun 0
set cg_draw2D 0
wait 80
noclip
setviewpos -1152 -1840 48 270
wait 50
screenshotJPEG portal_close
wait 4
setviewpos -1152 -1736 48 270
wait 70
screenshotJPEG portal_front
wait 4
setviewpos -1120 -1752 48 257
wait 60
screenshotJPEG portal_angle
wait 4
setviewpos -1152 -1620 48 270
wait 60
screenshotJPEG portal_far
wait 4
setviewpos -1152 -1200 24 270
wait 60
screenshotJPEG portal_mirror
wait 4
pt_info
echo SOFTWARE_LIGHTING_PORTAL_COMPLETE
quit
