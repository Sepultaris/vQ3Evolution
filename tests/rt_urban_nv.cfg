// Actual Urban Terror QVM and its item-use toggle. No r_nvOverride shortcut.
set fixedtime 16
set con_notifytime 0
set r_nvOverride 0
set r_nvNightVision 1
set r_nvTint 1
set r_nvBrightness 1.6
set r_nvGrain 0.4
set r_nvVignette 1
set r_nvDebug 0
set cg_nvg 0
// The harness equips ONLY goggles before spawning. The mod starts them on.
// Changing gear after spawning leaves the old vest selected until respawn.
wait 40
ut_itemuse
wait 20
setviewpos -1510 200 24 0
wait 30
screenshotJPEG urban_nv_off
wait 4
ut_itemuse
wait 50
screenshotJPEG urban_nv_on
wait 4
set cg_nvg 8
wait 30
screenshotJPEG urban_nv_colour8
wait 4
ut_itemuse
wait 40
screenshotJPEG urban_nv_off_again
wait 4
r_nvOverride
pt_info
echo SOFTWARE_LIGHTING_URBAN_NV_COMPLETE
quit
