// Heavier variant of the q3dm6 tuning scene: bounces 6 to amplify
// secondary-bounce shadow probes. Same production mode 57 scene/settings.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
set r_pathTracingSamples 2
set r_pathTracingBounces 6
set r_pathTracingExposure 8
set r_pathTracingDenoise 1
set r_pathTracingTemporal 1
set r_pathTracingHistory 8
set r_pathTracingLightLoop 1
set r_pathTracingMapLightCull 0
set r_pathTracingEmitterSearch 1
set r_pathTracingEmitterGeometry 1
set r_pathTracingBRDFReuse 1
set r_pathTracingAliasPDF 0
set r_pathTracingCompactTransport 1
set r_pathTracingStaged 0
set r_pathTracingAdaptive 0
set r_pathTracingDlightReservoir 0
wait 16
setviewpos -1616 200 24 0
wait 40
echo PT_PROGRAM_REFERENCE_A
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 1
wait 32
set r_pathTracingShaderProfile 0
echo PT_PROGRAM_COMPLETE
pt_info
quit