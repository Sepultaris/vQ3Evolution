// Actual rocket impact + sustained lightning fire, isolated from saved settings.
set fixedtime 100
set sv_fps 125
set con_notifytime 0
set cg_noProjectileTrail 1
set cg_oldRocket 0
set r_muzzleFlashBrightness 1
set r_muzzleFlashLightScale 1
set r_rocketLightScale 0
set r_rocketExplosionLightScale 1
set r_lightningGunLightScale 1
cmd setviewpos -208 448 24 0
wait 10
give "Rocket Launcher"
give "Lightning Gun"
god
wait 10
weapon 5
wait 80
set fixedtime 16
+attack
wait 12
-attack
wait 28
set fixedtime 1
wait 8
pt_info
screenshotJPEG explosion_light_on
wait 2
r_rocketExplosionLightScale 0
wait 8
pt_info
screenshotJPEG explosion_light_off
wait 2
r_rocketExplosionLightScale .25
wait 8
pt_info
screenshotJPEG explosion_light_dim
wait 2
set fixedtime 100
weapon 6
wait 80
set fixedtime 16
+attack
wait 24
set fixedtime 1
wait 8
pt_info
screenshotJPEG lightning_light_on
wait 2
r_lightningGunLightScale 0
wait 8
pt_info
screenshotJPEG lightning_light_off
wait 2
r_lightningGunLightScale .25
wait 8
pt_info
screenshotJPEG lightning_light_dim
wait 2
-attack
writeconfig weapon-lights-check.cfg
echo SOFTWARE_LIGHTING_WEAPON_EFFECTS_COMPLETE
wait 4
quit
