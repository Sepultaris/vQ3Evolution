// Attended resize/fullscreen/minimize test. Periodic snapshots and automatic exit.
set fixedtime 0
set com_maxfps 30
set com_maxfpsUnfocused 30
set com_maxfpsMinimized 30
set r_allowResize 1
set cg_draw2D 1
set con_notifytime 0
bind F7 minimize
vid_restart
wait 240
echo PT_WINDOW_SAMPLE_0
pt_info
r_fullscreen
r_mode
r_customwidth
r_customheight
wait 600
