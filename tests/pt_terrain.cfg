// Overdose / mpterra1: two views through grass-rock transition triangles.
set fixedtime 16
set con_notifytime 0
wait 24
noclip
god
setviewpos -1024 0 240 0
wait 4
+lookdown
wait 8
-lookdown
wait 24
viewpos
pt_info
screenshot terrain_center
wait 4
setviewpos 4000 1000 240 135
wait 4
+lookdown
wait 8
-lookdown
wait 24
viewpos
screenshot terrain_base
wait 4
echo PT_PROGRAM_COMPLETE
quit
