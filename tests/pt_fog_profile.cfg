// Optional shader-clock diagnosis only; not a production FPS measurement.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
wait 80
noclip
setviewpos -64 -720 24 90
wait 32
echo PT_FOG_DIAGNOSTIC
set r_pathTracingShaderProfile 1
wait 8
set r_pathTracingProfile 1
wait 40
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
wait 4
pt_info
echo PT_PROGRAM_COMPLETE
quit
