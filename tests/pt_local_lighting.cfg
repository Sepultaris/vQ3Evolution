// Isolated changed-light locality diagnostic on stock geometry.
set fixedtime 16
set con_notifytime 0
set r_pathTracingTestScene 0
set r_pathTracingReference 0
set r_pathTracingSamples 2
set r_pathTracingBounces 4
set r_pathTracingExposure 8
set r_pathTracingDenoise 1
set r_pathTracingTemporal 1
set r_pathTracingHistory 8
set r_pathTracingDebug 0
set r_pathTracingTemporalDebug 4
wait 240
set cg_draw2D 0
set cg_drawGun 1
set cg_bobup 0
set cg_bobpitch 0
set cg_bobroll 0
give all
weapon 2
setviewpos -1616 200 24 180
wait 80
pt_info
screenshotJPEG pt_local_before
wait 4
+attack
wait 24
screenshotJPEG pt_local_flash_0
wait 2
screenshotJPEG pt_local_flash_1
wait 2
screenshotJPEG pt_local_flash_2
wait 2
screenshotJPEG pt_local_flash_3
wait 2
screenshotJPEG pt_local_flash_4
wait 2
screenshotJPEG pt_local_flash_5
wait 2
screenshotJPEG pt_local_flash_6
wait 2
screenshotJPEG pt_local_flash_7
wait 2
screenshotJPEG pt_local_flash_8
wait 2
screenshotJPEG pt_local_flash_9
wait 2
screenshotJPEG pt_local_flash_10
wait 2
screenshotJPEG pt_local_flash_11
wait 2
-attack
wait 20
pt_info
screenshotJPEG pt_local_after
wait 3
set r_pathTracingTemporalDebug 0
quit
