// Invoked by activeAction AFTER the first game snapshot, never during loading.
// Fixed animation time and camera; quality settings are copied from the user.
set fixedtime 16
set con_notifytime 0
cmd setviewpos -208 448 24 0
// setviewpos uses the game's teleporter and imparts velocity. Let it settle.
wait 80
viewpos
r_pathTracingProfile 1
wait 6
echo SW_MEASURE_BEGIN
wait 64
echo SW_MEASURE_END
viewpos
r_pathTracingProfile 0
screenshotJPEG software_profile
wait 16
pt_info
echo SOFTWARE_LIGHTING_PROFILE_COMPLETE
quit
