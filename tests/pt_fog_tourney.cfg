// Q3Tourney2 grated bridge from the user's report; fixed saved quality.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
wait 80
noclip
setviewpos -64 -720 24 90
wait 64
viewpos
echo PT_FOG_BRIDGE
set r_pathTracingProfile 1
wait 48
set r_pathTracingProfile 0
screenshot fog_bridge
wait 4
setviewpos -64 -450 -150 90
wait 64
viewpos
echo PT_FOG_INSIDE
screenshot fog_inside
wait 4
pt_info
echo PT_PROGRAM_COMPLETE
quit
