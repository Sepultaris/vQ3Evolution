// Real shipped map materials, above/below water and through a glass window.
set r_pathTracingTestScene 0
set con_notifytime 0
set fixedtime 16
set r_pathTracingReference 0
set r_pathTracingDenoise 1
set r_pathTracingTemporal 1
set r_pathTracingTemporalDebug 0
set r_pathTracingDebug 0
set r_pathTracingSamples 4
set r_pathTracingBounces 8
set r_pathTracingExposure 2
devmap q3dm8
// Allow the loopback client to complete connection/priming at fixedtime 16.
// Faster renderers otherwise exhaust the script before setviewpos can arrive.
wait 240
set cg_draw2D 0
set cg_drawGun 0
noclip
setviewpos 640 900 70 90
wait 50
set cl_pitchspeed 90
+lookdown
wait 20
-lookdown
wait 15
pt_info
viewpos
screenshotJPEG pt_water_above
wait 4
set r_pathTracingDebug 6
wait 4
screenshotJPEG pt_water_mask
wait 4
set r_pathTracingDebug 0
setviewpos 640 1024 -50 90
wait 50
pt_info
viewpos
screenshotJPEG pt_water_below
wait 4
devmap q3dm11
wait 240
noclip
setviewpos 0 -968 132 0
wait 50
pt_info
viewpos
screenshotJPEG pt_stock_glass
wait 4
set r_pathTracingDebug 6
wait 4
screenshotJPEG pt_stock_glass_mask
wait 4
set r_pathTracingDebug 0
quit
