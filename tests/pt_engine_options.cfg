// Engine overlay in a loaded map, without invoking or replacing a mod menu.
set fixedtime 16
set con_notifytime 0
wait 24
fs_game
pt_info
vq3e_options display
wait 4
screenshot options_display
wait 4
vq3e_options lighting
wait 4
screenshot options_lighting
wait 4
vq3e_options nvidia
wait 4
screenshot options_nvidia
wait 4
vq3e_options interface
wait 4
screenshot options_interface
wait 4
vq3e_options close
wait 4
screenshot options_game
wait 4
disconnect
wait 8
screenshot options_mod_menu
wait 4
vq3e_options interface
wait 4
screenshot options_over_menu
wait 4
vq3e_options close
echo PT_PROGRAM_COMPLETE
quit
