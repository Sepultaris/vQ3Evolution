// Attended focus recovery: switch away after initial focused samples, then return.
// Twenty samples allow UI-control latency without accepting a missed transition.
// The last two intervals turn the camera; the process exits automatically.
set fixedtime 0
set com_maxfps 30
set com_maxfpsUnfocused 30
set com_maxfpsMinimized 30
set cg_draw2D 1
set cg_drawGun 1
set con_notifytime 0
set r_pathTracingReference 0
set r_pathTracingSamples 4
set r_pathTracingBounces 4
set r_pathTracingDenoise 1
set r_pathTracingTemporal 1
wait 240
echo PT_FOCUS_STATIC_0
nvidia_info
wait 300
echo PT_FOCUS_STATIC_1
nvidia_info
wait 300
echo PT_FOCUS_STATIC_2
nvidia_info
wait 300
echo PT_FOCUS_STATIC_3
nvidia_info
wait 300
echo PT_FOCUS_STATIC_4
nvidia_info
wait 300
echo PT_FOCUS_STATIC_5
nvidia_info
wait 300
echo PT_FOCUS_STATIC_6
nvidia_info
wait 300
echo PT_FOCUS_STATIC_7
nvidia_info
wait 300
echo PT_FOCUS_STATIC_8
nvidia_info
wait 300
echo PT_FOCUS_STATIC_9
nvidia_info
wait 300
echo PT_FOCUS_STATIC_10
nvidia_info
wait 300
echo PT_FOCUS_STATIC_11
nvidia_info
wait 300
echo PT_FOCUS_STATIC_12
nvidia_info
wait 300
echo PT_FOCUS_STATIC_13
nvidia_info
wait 300
echo PT_FOCUS_STATIC_14
nvidia_info
wait 300
echo PT_FOCUS_STATIC_15
nvidia_info
wait 300
echo PT_FOCUS_STATIC_16
nvidia_info
wait 300
echo PT_FOCUS_STATIC_17
nvidia_info
+right
wait 300
echo PT_FOCUS_MOVING_18
nvidia_info
wait 300
echo PT_FOCUS_MOVING_19
nvidia_info
-right
echo PT_FOCUS_COMPLETE
quit
