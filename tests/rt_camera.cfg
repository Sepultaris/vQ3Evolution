// Destructive to test-session settings only: run in an isolated fs_homepath.
// Start q3dm6 with devmap before executing this script. It exits the game.
set cg_draw2D 1
set cg_drawGun 1
set cg_draw3dIcons 1
set cg_bobup 0
set cg_bobpitch 0
set cg_bobroll 0
set cl_yawspeed 60
set con_notifytime 0
wait 160
setviewpos -1616 200 24 0
wait 100
screenshotJPEG rt_camera_start
+right
wait 70
-right
wait 5
screenshotJPEG rt_camera_turn
+left
wait 70
-left
wait 20
screenshotJPEG rt_camera_return
+forward
wait 60
-forward
wait 30
screenshotJPEG rt_camera_move
wait 10
vid_restart
wait 160
screenshotJPEG rt_camera_restart
wait 5
disconnect
wait 60
screenshotJPEG rt_camera_menu
wait 5
quit
