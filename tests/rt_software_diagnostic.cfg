// activeAction: first active game snapshot. Same camera/settings as normal profiling.
set fixedtime 16
set con_notifytime 0
cmd setviewpos -208 448 24 0
wait 80
viewpos
r_pathTracingProfile 1
wait 6
echo SW_DIAGNOSTIC_BEGIN
wait 64
echo SW_DIAGNOSTIC_END
viewpos
r_softwareRayTracingProfile 0
wait 4
r_pathTracingProfile 0
screenshotJPEG software_diagnostic
wait 4
pt_info
echo SOFTWARE_LIGHTING_DIAGNOSTIC_COMPLETE
quit
