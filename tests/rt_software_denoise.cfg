// Same two-sample camera sequence for native and NRD quality checks.
set fixedtime 16
set cg_draw2D 0
set cg_drawGun 0
set con_notifytime 0
wait 80
set r_pathTracingExposure 8
// Authored spawn and facing from maps/q3dm6.bsp, not the wall behind it.
setviewpos -208 448 24 0
wait 24
screenshotJPEG software_denoise_still
wait 4
setviewpos -208 448 24 12
wait 1
screenshotJPEG software_denoise_move_1
wait 8
screenshotJPEG software_denoise_move_8
pt_info
wait 2
echo SOFTWARE_LIGHTING_DENOISE_COMPLETE
quit
