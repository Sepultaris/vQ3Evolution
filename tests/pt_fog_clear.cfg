// No-fog map regression at saved fixed-two-sample DLAA quality.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
wait 80
setviewpos -1510 200 24 0
wait 64
echo PT_FOG_CLEAR
set r_pathTracingProfile 1
wait 80
set r_pathTracingProfile 0
screenshot fog_clear
wait 4
pt_info
echo PT_PROGRAM_COMPLETE
quit
