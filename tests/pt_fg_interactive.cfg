// Allow time to bring the isolated test window into focus, then run and exit.
// The checker rejects focus loss anywhere in a measured interval.
set fixedtime 0
set com_maxfps 60
set com_maxfpsUnfocused 60
set com_maxfpsMinimized 60
echo PT_FG_READY_FOR_FOCUS
wait 1800
exec pt_frame_generation.cfg
