// Native, opt-in optical fixtures. Runner preserves quality and owns deadline.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
wait 40
set r_pathTracingTestScene 1
vid_restart
wait 32
noclip
setviewpos 10000 0 64 0
wait 64
echo PT_RR_GLASS
screenshotJPEG rr_glass
wait 4
+right
wait 10
-right
screenshotJPEG rr_glass_motion
wait 4
set r_pathTracingTestScene 2
set r_pathTracingTestMotion 0
vid_restart
wait 32
setviewpos 10000 0 64 0
wait 64
echo PT_RR_MIRROR
screenshotJPEG rr_mirror
wait 4
set r_pathTracingTestMotion 1
wait 32
echo PT_RR_MIRROR_MOVING
screenshotJPEG rr_mirror_moving
wait 4
set r_pathTracingTestMotion 2
wait 48
screenshotJPEG rr_mirror_removed
wait 4
pt_info
echo PT_PROGRAM_COMPLETE
quit
