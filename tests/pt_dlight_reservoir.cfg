// Same scene, rendering math and saved quality. A/B/B/A, both pipelines prewarmed.
// Reference = per-light dlight shadow rays (mode 57), Optimized = single-ray
// dlight reservoir (mode 121). Light reuse stays enabled for both.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
set r_pathTracingLightLoop 1
set r_pathTracingMapLightCull 0
set r_pathTracingEmitterSearch 0
set r_pathTracingEmitterGeometry 0
set r_pathTracingBRDFReuse 1
set r_pathTracingAliasPDF 0
set r_pathTracingCompactTransport 1
set r_pathTracingStaged 0
set r_pathTracingLightReuse 1
set r_pathTracingAdaptive 0
set r_pathTracingDlightReservoir 0
wait 16
setviewpos -1616 200 24 0
wait 40
viewpos
echo PT_PROGRAM_REFERENCE_A
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 1
wait 32
set r_pathTracingShaderProfile 0
screenshotJPEG dlight_reservoir_reference_a
wait 8
set r_pathTracingDlightReservoir 1
wait 12
echo PT_PROGRAM_OPTIMIZED_A
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 1
wait 32
set r_pathTracingShaderProfile 0
screenshotJPEG dlight_reservoir_optimized_a
wait 8
echo PT_PROGRAM_OPTIMIZED_B
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 1
wait 32
set r_pathTracingShaderProfile 0
screenshotJPEG dlight_reservoir_optimized_b
wait 8
set r_pathTracingDlightReservoir 0
wait 12
echo PT_PROGRAM_REFERENCE_B
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 1
wait 32
set r_pathTracingShaderProfile 0
screenshotJPEG dlight_reservoir_reference_b
wait 8
echo PT_PROGRAM_COMPLETE
pt_info
quit