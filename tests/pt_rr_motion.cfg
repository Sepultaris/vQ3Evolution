// Match saved quality; exercise settled, tracked pan, then a fast turn/cut.
set fixedtime 16
set con_notifytime 0
set cl_yawspeed 15
set r_pathTracingProfile 0
wait 80
setviewpos -1510 200 24 0
wait 64
viewpos
echo PT_RR_MOTION_STATIONARY
set r_pathTracingProfile 1
wait 64
set r_pathTracingProfile 0
screenshot rr_motion_stationary
wait 4
set r_pathTracingAdaptiveDebug 1
wait 4
screenshot rr_motion_budget_stationary
wait 4
set r_pathTracingAdaptiveDebug 0
+right
wait 8
echo PT_RR_MOTION_PAN
set r_pathTracingProfile 1
wait 80
set r_pathTracingProfile 0
screenshot rr_motion_pan
wait 4
set r_pathTracingAdaptiveDebug 1
wait 4
screenshot rr_motion_budget_pan
wait 4
-right
set r_pathTracingAdaptiveDebug 0
viewpos
set cl_yawspeed 140
+right
wait 16
screenshot rr_motion_fast
wait 4
set r_pathTracingAdaptiveDebug 1
wait 4
screenshot rr_motion_budget_fast
wait 4
-right
set r_pathTracingAdaptiveDebug 0
setviewpos -1510 200 24 0
wait 2
set r_pathTracingAdaptiveDebug 1
wait 2
screenshot rr_motion_budget_cut
wait 4
set r_pathTracingAdaptiveDebug 0
wait 48
screenshot rr_motion_settled
wait 4
pt_info
echo PT_PROGRAM_COMPLETE
quit
