// Native tracked target seen ONLY through a static metal mirror.
set fixedtime 16
set con_notifytime 0
set r_pathTracingTestScene 2
set r_pathTracingTestMotion 0
set r_pathTracingSampling 1
set r_pathTracingReference 0
set r_pathTracingSamples 4
set r_pathTracingBounces 4
set r_pathTracingExposure 1
set r_pathTracingDenoise 1
set r_pathTracingTemporal 1
set r_pathTracingHistory 8
set r_pathTracingDebug 0
set r_pathTracingTemporalDebug 3
vid_restart
wait 240
set cg_draw2D 0
set cg_drawGun 0
noclip
setviewpos 10000 0 64 0
wait 80
viewpos
pt_info
screenshotJPEG pt_mirror_static
wait 4
set r_pathTracingTestMotion 1
wait 45
screenshotJPEG pt_mirror_moving
wait 4
set r_pathTracingTemporalDebug 0
wait 8
screenshotJPEG pt_mirror_beauty_a
wait 25
screenshotJPEG pt_mirror_beauty_b
wait 4
set r_pathTracingTemporalDebug 3
+right
wait 12
screenshotJPEG pt_mirror_turn
-right
wait 4
set r_pathTracingTestMotion 2
wait 2
screenshotJPEG pt_mirror_removed
wait 20
screenshotJPEG pt_mirror_recovered
wait 3
set r_pathTracingTestScene 0
set r_pathTracingTestMotion 0
set r_pathTracingTemporalDebug 0
quit
