// Use only in an isolated test profile. Launch with r_rayTracing 2 and devmap q3dm6.
set cg_draw2D 0
set cg_drawGun 0
set con_notifytime 0
set r_pathTracingReference 0
set r_pathTracingSamples 8
set r_pathTracingExposure 8
set r_pathTracingBounces 1
wait 60
setviewpos -1616 200 24 0
wait 100
set r_pathTracingReference 1
wait 400
pt_info
screenshotJPEG pt_direct
wait 5
set r_pathTracingBounces 4
wait 400
pt_info
screenshotJPEG pt_bounce
wait 5
set r_pathTracingReference 0
set cg_draw2D 1
set cg_drawGun 1
+right
wait 60
-right
wait 10
screenshotJPEG pt_interactive
wait 5
quit
