// Isolated NV appearance/control comparison, identical camera and settings.
set fixedtime 16
set con_notifytime 0
set cg_drawGun 1
set cg_draw2D 1
set r_nvNightVision 1
set r_nvBrightness 1.6
set r_nvGrain 0.4
set r_nvVignette 1
set r_nvDebug 0
wait 70
setviewpos -208 448 24 0
set r_nvOverride 0
wait 50
screenshotJPEG nv_off
wait 4
set r_nvTint 1
set r_nvOverride 1
wait 40
screenshotJPEG nv_white
wait 4
set r_nvTint 0
wait 20
screenshotJPEG nv_green
wait 4
set r_nvTint 1
set r_nvGrain 0
set r_nvVignette 0
wait 20
screenshotJPEG nv_fullscreen
wait 4
set r_nvDebug 1
wait 20
screenshotJPEG nv_debug
wait 4
set r_nvOverride 0
pt_info
echo SOFTWARE_LIGHTING_NV_COMPLETE
quit
