// Live weapon-light/visible-flash independence with isolated settings.
set r_lightningGunLightScale 1
set fixedtime 16
set con_notifytime 0
cmd setviewpos -208 448 24 0
wait 80
give all
wait 20
weapon 6
wait 40
+attack
wait 16
r_muzzleFlashBrightness 1
r_muzzleFlashLightScale 1
wait 24
pt_info
screenshotJPEG muzzle_default
wait 2
r_muzzleFlashBrightness 0
wait 24
pt_info
screenshotJPEG muzzle_hidden_lit
wait 2
r_muzzleFlashBrightness 1
r_muzzleFlashLightScale 0
wait 24
pt_info
screenshotJPEG muzzle_visible_unlit
wait 2
r_muzzleFlashBrightness 0
wait 24
pt_info
screenshotJPEG muzzle_both_off
wait 2
r_muzzleFlashBrightness 2
r_muzzleFlashLightScale 2
wait 24
pt_info
screenshotJPEG muzzle_boost
wait 2
-attack
r_muzzleFlashBrightness 1
r_muzzleFlashLightScale 1
echo SOFTWARE_LIGHTING_MUZZLE_COMPLETE
wait 4
quit
