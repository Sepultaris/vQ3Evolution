set fixedtime 16
set com_maxfps 0
set com_maxfpsUnfocused 0
set com_maxfpsMinimized 0
set cg_draw2D 0
set cg_drawGun 1
set cg_bobup 0
set cg_bobpitch 0
set cg_bobroll 0
set con_notifytime 0
set cl_yawspeed 45
set r_pathTracingReference 0
set r_pathTracingSamples 4
set r_pathTracingBounces 4
set r_pathTracingExposure 1
set r_pathTracingDenoise 1
set r_pathTracingTemporal 1
set r_pathTracingHistory 8
set r_pathTracingTemporalDebug 0
set r_pathTracingDebug 0
set r_pathTracingProfile 0
// Let loopback snapshot delivery complete even on fast lower-resolution runs.
wait 240
setviewpos -1616 200 24 0
wait 80
viewpos
echo PT_BENCH_STATIC
set r_pathTracingProfile 1
wait 600
echo PT_BENCH_TURN
+right
wait 600
-right
set r_pathTracingProfile 0
wait 3
pt_info
quit
