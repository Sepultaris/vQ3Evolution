// Load shared 75% scales over a 50% per-game config, then replace the profile.
set fixedtime 16
set con_notifytime 0
wait 16
ui_scale
cg_hudScale
vq3e_options interface
wait 4
screenshot profile_loaded
wait 4
vq3e_options close
ui_scale 0.8
cg_hudScale 0.9
wait 4
vq3e_options interface
wait 4
screenshot profile_changed
wait 4
vq3e_options apply
wait 4
ui_scale
cg_hudScale
echo PT_PROGRAM_COMPLETE
quit
