// Saved-settings A/B/B/A; retain the validated BRDF optimization in every phase.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
set r_pathTracingEmitterSearch 0
set r_pathTracingBRDFReuse 1
set r_pathTracingMapLightCull 1
wait 64
setviewpos -1616 200 24 0
wait 40
viewpos
set r_pathTracingMapLightCull 0
wait 12
echo PT_PROGRAM_REFERENCE_A
r_pathTracingMapLightCull
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
set r_pathTracingMapLightCull 1
wait 12
echo PT_PROGRAM_OPTIMIZED_A
r_pathTracingMapLightCull
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
wait 12
echo PT_PROGRAM_OPTIMIZED_B
r_pathTracingMapLightCull
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
set r_pathTracingMapLightCull 0
wait 12
echo PT_PROGRAM_REFERENCE_B
r_pathTracingMapLightCull
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
wait 4
echo PT_PROGRAM_COMPLETE
pt_info
quit
