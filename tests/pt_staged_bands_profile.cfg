// Diagnostic only: dispatch timestamps perturb scheduling; no FPS claim.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
set r_pathTracingMaterialCache 1
set r_pathTracingEmitterGeometry 1
set r_pathTracingCompactTransport 1
set r_pathTracingStagedRows 32
set r_pathTracingStagedProfile 0
set r_pathTracingStaged 1
wait 16
setviewpos -1616 200 24 0
wait 40
viewpos
set r_pathTracingProfile 1
set r_pathTracingStagedProfile 1
wait 56
set r_pathTracingStagedProfile 0
set r_pathTracingProfile 0
wait 4
pt_info
echo PT_CACHE_COMPLETE
quit
