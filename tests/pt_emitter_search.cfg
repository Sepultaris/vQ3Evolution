// Original/indexed/indexed/original, with saved graphics and a 45-second watchdog.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
set r_pathTracingEmitterSearch 1
wait 80
setviewpos -1616 200 24 0
wait 40
viewpos
set r_pathTracingEmitterSearch 0
wait 12
echo PT_PROGRAM_REFERENCE_A
r_pathTracingEmitterSearch
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
set r_pathTracingEmitterSearch 1
wait 12
echo PT_PROGRAM_OPTIMIZED_A
r_pathTracingEmitterSearch
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
wait 12
echo PT_PROGRAM_OPTIMIZED_B
r_pathTracingEmitterSearch
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
set r_pathTracingEmitterSearch 0
wait 12
echo PT_PROGRAM_REFERENCE_B
r_pathTracingEmitterSearch
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
set r_pathTracingEmitterSearch 1
wait 4
echo PT_PROGRAM_COMPLETE
pt_info
quit
