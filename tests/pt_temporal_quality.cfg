// Fixed-camera temporal reconstruction comparison, isolated devmap q3dm6.
set cg_draw2D 0
set cg_drawGun 0
set cg_bobup 0
set cg_bobpitch 0
set cg_bobroll 0
set con_notifytime 0
set r_pathTracingReference 0
set r_pathTracingSamples 8
set r_pathTracingBounces 4
set r_pathTracingExposure 8
set r_pathTracingDenoise 1
set r_pathTracingHistory 8
set r_pathTracingTemporalDebug 0
wait 80
setviewpos -1616 200 24 0
wait 80
set r_pathTracingReference 1
wait 400
screenshotJPEG pt_temporal_reference
wait 5
set r_pathTracingReference 0
set r_pathTracingSamples 1
set r_pathTracingTemporal 0
wait 80
screenshotJPEG pt_spatial_0
wait 2
screenshotJPEG pt_spatial_1
wait 2
screenshotJPEG pt_spatial_2
wait 2
screenshotJPEG pt_spatial_3
wait 5
set r_pathTracingTemporal 1
wait 80
pt_info
screenshotJPEG pt_history_0
wait 2
screenshotJPEG pt_history_1
wait 2
screenshotJPEG pt_history_2
wait 2
screenshotJPEG pt_history_3
wait 5
set r_pathTracingTemporalDebug 1
wait 5
screenshotJPEG pt_temporal_mask
wait 5
set r_pathTracingTemporalDebug 0
quit
