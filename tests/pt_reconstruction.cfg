// Isolated profile, r_rayTracing 2, r_dlss 0, devmap q3dm6.
set cg_draw2D 0
set cg_drawGun 0
set con_notifytime 0
set r_pathTracingReference 0
set r_pathTracingTemporal 0
set r_pathTracingTemporalDebug 0
set r_pathTracingSamples 8
set r_pathTracingBounces 4
set r_pathTracingExposure 8
wait 60
setviewpos -1616 200 24 0
wait 100
set r_pathTracingReference 1
wait 400
screenshotJPEG pt_filter_reference
wait 5
set r_pathTracingReference 0
set r_pathTracingSamples 4
set r_pathTracingDenoise 0
wait 20
pt_info
screenshotJPEG pt_filter_raw
wait 5
set r_pathTracingDenoise 1
wait 20
pt_info
screenshotJPEG pt_filter_on
wait 5
set cg_draw2D 1
set cg_drawGun 1
+right
wait 60
-right
wait 10
screenshotJPEG pt_filter_moving
wait 5
quit
