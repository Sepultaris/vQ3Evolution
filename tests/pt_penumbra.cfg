// Live source-size controls at saved quality in an isolated profile.
set fixedtime 16
set con_notifytime 0
wait 48
noclip
god
setviewpos -1152 -1200 24 270
r_pathTracingSunAngle 0
r_pathTracingLightRadius 0
wait 40
pt_info
screenshot penumbra_hard
wait 4
r_pathTracingLightRadius 8
wait 40
pt_info
screenshot penumbra_point
wait 4
r_pathTracingSunAngle 2
wait 40
pt_info
screenshot penumbra_sun
wait 4
r_pathTracingLightRadius 0
r_pathTracingSunAngle 0
wait 40
pt_info
screenshot penumbra_restored
wait 4
echo PT_PROGRAM_COMPLETE
quit
