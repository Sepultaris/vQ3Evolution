// Bounded same-process A/B/B/A comparison. Run with an external 45s watchdog.
set fixedtime 16
set com_maxfps 0
set com_maxfpsUnfocused 0
set com_maxfpsMinimized 0
set cg_draw2D 0
set cg_drawGun 1
set cg_bobup 0
set cg_bobpitch 0
set cg_bobroll 0
set con_notifytime 0
set r_pathTracingReference 0
set r_pathTracingSamples 4
set r_pathTracingBounces 4
set r_pathTracingExposure 1
set r_pathTracingDenoise 1
set r_pathTracingTemporal 1
set r_pathTracingHistory 8
set r_pathTracingTemporalDebug 0
set r_pathTracingDebug 0
set r_pathTracingProfile 0
wait 240
setviewpos -1616 200 24 0
wait 80
viewpos
set r_pathTracingMaterialFastPath 0
wait 40
echo PT_PROGRAM_REFERENCE_A
set r_pathTracingProfile 1
wait 120
set r_pathTracingProfile 0
set r_pathTracingMaterialFastPath 1
wait 40
echo PT_PROGRAM_OPTIMIZED_A
set r_pathTracingProfile 1
wait 120
set r_pathTracingProfile 0
wait 40
echo PT_PROGRAM_OPTIMIZED_B
set r_pathTracingProfile 1
wait 120
set r_pathTracingProfile 0
set r_pathTracingMaterialFastPath 0
wait 40
echo PT_PROGRAM_REFERENCE_B
set r_pathTracingProfile 1
wait 120
set r_pathTracingProfile 0
wait 4
echo PT_PROGRAM_COMPLETE
pt_info
quit
