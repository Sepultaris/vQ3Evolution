// Stock colored fog above and inside the blue pit on q3ctf3; saved quality.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
wait 80
noclip
setviewpos 0 -1680 -24 270
wait 64
viewpos
echo PT_FOG_OUTSIDE
screenshot fog_outside
wait 4
setviewpos 0 -1950 -110 270
wait 64
viewpos
echo PT_FOG_INSIDE
screenshot fog_inside
wait 4
pt_info
echo PT_PROGRAM_COMPLETE
quit
