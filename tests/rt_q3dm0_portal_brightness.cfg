// Preserve saved exposure/bloom. Check the aperture at ordinary viewing distances.
set fixedtime 16
set con_notifytime 0
set cg_drawGun 0
set cg_draw2D 0
wait 40
noclip
setviewpos -1152 -1780 32 270
wait 40
screenshotJPEG portal_brightness_near
wait 4
setviewpos -1152 -1736 48 270
wait 40
screenshotJPEG portal_brightness_front
wait 4
setviewpos -1120 -1752 48 257
wait 40
screenshotJPEG portal_brightness_angle
wait 4
setviewpos -1152 -1620 48 270
wait 40
screenshotJPEG portal_brightness_far
wait 4
pt_info
echo SOFTWARE_LIGHTING_PORTAL_COMPLETE
quit
