// Renderer restart and native-diagnostic/RR transitions at runner-owned quality.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
wait 80
setviewpos -1510 200 24 0
wait 32
echo PT_RR_BEFORE_RESTART
pt_info
screenshotJPEG rr_before_restart
wait 4
vid_restart
wait 48
echo PT_RR_AFTER_RESTART
pt_info
screenshotJPEG rr_after_restart
wait 4
set r_pathTracingDebug 1
wait 12
echo PT_RR_NATIVE_DIAGNOSTIC
screenshotJPEG rr_diagnostic
wait 4
set r_pathTracingDebug 0
wait 48
echo PT_RR_RESUMED
pt_info
screenshotJPEG rr_resumed
wait 4
echo PT_PROGRAM_COMPLETE
quit
