// Functional MFG/menu check, not a performance benchmark. Runner owns settings.
set fixedtime 0
set com_maxfps 60
set com_maxfpsUnfocused 60
set con_notifytime 0
set cg_draw2D 1
set cg_drawGun 1
wait 90
echo PT_FG_BASELINE
nvidia_info
r_dlssFrameGenerationMaxMultiplier
wait 120
echo PT_FG_STATIC
nvidia_info
+right
wait 120
-right
echo PT_FG_MOVING
nvidia_info
screenshotJPEG mfg_gameplay
wait 4
set developer 1
ui_testMenu graphics
wait 20
screenshotJPEG mfg_graphics
wait 4
vq3e_options nvidia
wait 20
screenshotJPEG mfg_nvidia
wait 4
vq3e_options close
wait 4
echo PT_MFG_COMPLETE
quit
