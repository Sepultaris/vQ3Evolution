// Normal optimized renderer, saved quality, fixed camera then camera motion.
// No shader-clock/timestamp instrumentation or experimental transport.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
set r_pathTracingStaged 0
set r_pathTracingStagedProfile 0
wait 80
setviewpos -1616 200 24 0
wait 40
echo PT_NSIGHT_STATIONARY
viewpos
pt_info
wait 128
echo PT_NSIGHT_MOVING
set cl_yawspeed 40
+right
wait 96
-right
wait 64
echo PT_NSIGHT_COMPLETE
pt_info
quit
