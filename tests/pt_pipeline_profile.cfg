// One shader, driver compilation statistics and settled GPU timestamps.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
set r_pathTracingMapLightCull 0
set r_pathTracingAliasPDF 0
set r_pathTracingEmitterGeometry 0
set r_pathTracingBRDFReuse 1
set r_pathTracingEmitterSearch 0
wait 32
setviewpos -1616 200 24 0
wait 40
viewpos
echo PT_PIPELINE_BASELINE
set r_pathTracingProfile 1
wait 128
set r_pathTracingProfile 0
pt_info
echo PT_PIPELINE_COMPLETE
quit
