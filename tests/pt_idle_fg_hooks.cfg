// One fixed-settings phase. Compare separate launches because presentation-hook
// lifetime changes only at swapchain creation, never underneath live resources.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
set r_pathTracingBRDFReuse 1
set r_pathTracingLightLoop 1
set r_pathTracingMaterialCache 1
set r_pathTracingEmitterGeometry 1
wait 16
setviewpos -1616 200 24 0
wait 40
viewpos
echo PT_HOOKS_BEGIN
set r_pathTracingProfile 1
wait 200
set r_pathTracingProfile 0
screenshotJPEG idle_fg_hooks
wait 4
pt_info
echo PT_HOOKS_COMPLETE
quit
