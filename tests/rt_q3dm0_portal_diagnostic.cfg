// Same portal: isolate coating/light saturation from bloom, then disable the
// remote camera so a transformed image can be distinguished from its overlay.
set fixedtime 16
set con_notifytime 0
set cg_drawGun 0
set cg_draw2D 0
set r_postBloom 0
// Diagnostic only: saved auto-exposure has a 5x lower clamp, which washes out
// the portal coating. Leave actual-settings coverage in rt_q3dm0_portal.cfg.
set r_pathTracingAutoExposure 0
set r_autoExposure 0
set r_pathTracingExposure 1
wait 80
noclip
setviewpos -1152 -1780 32 270
wait 70
screenshotJPEG portal_no_bloom
wait 4
pt_info
set r_noportals 1
wait 30
screenshotJPEG portal_camera_off
wait 4
set r_noportals 0
set r_pathTracingDebug 3
wait 30
screenshotJPEG portal_emission
wait 4
echo SOFTWARE_LIGHTING_PORTAL_COMPLETE
quit
