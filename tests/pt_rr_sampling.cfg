// Same quality/profile view as pt_rr_quality; budgets are visualized separately.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
wait 80
setviewpos -1510 200 24 0
wait 64
viewpos
echo PT_PROGRAM_REFERENCE_A
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
screenshotJPEG rr_stationary
wait 4
set r_pathTracingAdaptiveDebug 1
wait 4
screenshotJPEG rr_budget_stationary
wait 4
set r_pathTracingAdaptiveDebug 0
+right
wait 40
screenshotJPEG rr_motion
wait 4
set r_pathTracingAdaptiveDebug 1
wait 4
screenshotJPEG rr_budget_motion
wait 4
-right
set r_pathTracingAdaptiveDebug 0
wait 48
screenshotJPEG rr_settled
wait 4
pt_info
echo PT_PROGRAM_COMPLETE
quit
