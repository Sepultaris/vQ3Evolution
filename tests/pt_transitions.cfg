// Isolated profile, launch r_rayTracing 2 and devmap q3dm6.
set cg_draw2D 1
set cg_drawGun 1
set con_notifytime 0
set r_pathTracingReference 0
set r_pathTracingSamples 4
set r_pathTracingDenoise 1
set r_pathTracingTemporal 1
set r_pathTracingTemporalDebug 0
set r_pathTracingBounces 4
set r_pathTracingExposure 8
wait 60
+right
wait 45
-right
wait 10
screenshotJPEG pt_transition_turn
wait 5
vid_restart
wait 100
pt_info
screenshotJPEG pt_transition_restart
wait 5
set r_customwidth 1280
set r_customheight 540
vid_restart
wait 100
pt_info
screenshotJPEG pt_transition_resize
wait 5
devmap q3dm17
wait 100
pt_info
screenshotJPEG pt_transition_map
wait 5
disconnect
wait 60
screenshotJPEG pt_transition_menu
wait 5
quit
