// Short RR-specific view check; fixed exposure isolates the authored coating.
set fixedtime 16
set con_notifytime 0
set cg_drawGun 0
set cg_draw2D 0
set r_pathTracingAutoExposure 0
set r_autoExposure 0
set r_pathTracingExposure 1
wait 40
noclip
setviewpos -1152 -1736 32 270
wait 40
screenshotJPEG portal_rr_front
wait 4
setviewpos -1152 -1200 24 270
wait 40
screenshotJPEG portal_rr_mirror
wait 4
pt_info
echo SOFTWARE_LIGHTING_PORTAL_COMPLETE
quit
