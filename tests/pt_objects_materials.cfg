// Isolated devmap q3dm6. Exercise animated player pose, effects and material time.
set con_notifytime 0
set cg_draw2D 0
set cg_drawGun 1
set cg_thirdPerson 1
set cg_thirdPersonRange 90
set cg_thirdPersonAngle 0
set r_pathTracingReference 0
set r_pathTracingSamples 4
set r_pathTracingBounces 4
set r_pathTracingExposure 8
set r_pathTracingDenoise 1
set r_pathTracingTemporal 1
set r_pathTracingTemporalDebug 1
wait 80
setviewpos -1616 200 24 0
wait 40
pt_info
screenshotJPEG pt_object_still
wait 5
+forward
wait 18
pt_info
screenshotJPEG pt_object_walk
wait 5
-forward
+moveup
wait 12
pt_info
screenshotJPEG pt_object_jump
-moveup
wait 5
set cg_thirdPerson 0
set cg_drawGun 0
set r_pathTracingTemporalDebug 0
set r_pathTracingSamples 16
setviewpos -1616 200 24 0
wait 50
pt_info
screenshotJPEG pt_material_live_0
wait 25
screenshotJPEG pt_material_live_1
wait 5
set r_pathTracingReference 1
wait 50
screenshotJPEG pt_material_frozen_0
wait 50
screenshotJPEG pt_material_frozen_1
wait 5
set r_pathTracingReference 0
set cg_drawGun 1
set cg_draw2D 1
set r_pathTracingSamples 4
give all
wait 10
weapon 5
wait 50
+attack
wait 12
screenshotJPEG pt_material_rocket
wait 5
-attack
quit
