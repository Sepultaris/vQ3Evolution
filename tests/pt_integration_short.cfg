// One bounded native GPU checkpoint. Runner owns the external watchdog.
set fixedtime 16
set com_maxfps 60
set cg_draw2D 0
set cg_drawGun 0
set cg_marks 1
set con_notifytime 0
set r_pathTracingReference 0
set r_pathTracingDenoise 1
set r_pathTracingTemporal 1
set r_pathTracingSamples 4
set r_pathTracingBounces 4
set r_pathTracingExposure 2
set r_pathTracingDebug 0
set r_pathTracingTemporalDebug 0
wait 240
give all
weapon 2
setviewpos -1616 200 24 0
set cl_pitchspeed 90
+lookdown
wait 30
-lookdown
wait 15
echo PT_SHORT_BEFORE_MARKS
pt_info
screenshotJPEG pt_short_before_marks
wait 3
+attack
wait 45
-attack
wait 25
echo PT_SHORT_AFTER_MARKS
pt_info
screenshotJPEG pt_short_after_marks
wait 3
set r_pathTracingTemporalDebug 1
wait 4
screenshotJPEG pt_short_mark_history
wait 3
set r_pathTracingTemporalDebug 0
echo PT_SHORT_COMPLETE
quit
