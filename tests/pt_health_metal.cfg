// Actual stock health pickups, saved quality and no test-scene replacement.
set fixedtime 16
set con_notifytime 0
wait 48
noclip
god
setviewpos -600 286 0 90
wait 56
viewpos
screenshot health_yellow
wait 4
setviewpos 32 -344 0 90
wait 56
viewpos
screenshot health_orange
wait 4
setviewpos 66 -340 0 120
wait 56
viewpos
screenshot health_orange_angle
wait 4
pt_info
echo PT_PROGRAM_COMPLETE
quit
