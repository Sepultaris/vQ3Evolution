// Isolated profile: r_rayTracing 2, devmap q3dm6. Green = reused world
// history, red = rejected/new world pixels, cyan = reused object history,
// blue = rejected/new dynamic geometry. Emitters keep their actual appearance.
// Advance game time deterministically so GPU speed cannot turn past the cut target.
set fixedtime 16
set cg_draw2D 0
set cg_drawGun 1
set cg_bobup 0
set cg_bobpitch 0
set cg_bobroll 0
set cl_yawspeed 45
set con_notifytime 0
set r_pathTracingReference 0
set r_pathTracingSamples 2
set r_pathTracingBounces 4
set r_pathTracingExposure 8
set r_pathTracingDenoise 1
set r_pathTracingTemporal 1
set r_pathTracingHistory 8
set r_pathTracingTemporalDebug 1
wait 80
setviewpos -1616 200 24 0
wait 80
pt_info
screenshotJPEG pt_temporal_static
wait 5
+right
wait 60
pt_info
screenshotJPEG pt_temporal_turn
wait 5
-right
+forward
wait 40
screenshotJPEG pt_temporal_move
wait 5
-forward
setviewpos -1616 200 24 180
// setviewpos is a server command: wait for its client snapshot before logging.
// This is a recovery capture, not guaranteed to be the first frame after a cut.
wait 40
pt_info
screenshotJPEG pt_temporal_cut_recovery
wait 40
screenshotJPEG pt_temporal_settled
wait 5
set r_pathTracingTemporalDebug 0
set cg_draw2D 1
+attack
wait 40
-attack
wait 5
pt_info
screenshotJPEG pt_temporal_lit
wait 5
quit
