// Dense fog: separately reported, never substituted for the bridge benchmark.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
wait 80
noclip
setviewpos -64 -450 -150 90
wait 48
viewpos
echo PT_FOG_DENSE
set r_pathTracingProfile 1
wait 64
set r_pathTracingProfile 0
screenshot fog_inside
wait 4
pt_info
echo PT_PROGRAM_COMPLETE
quit
