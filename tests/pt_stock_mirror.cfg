// Stock Q3DM0 mirror. Saved quality, no synthetic scene or exposure overrides.
set fixedtime 16
set con_notifytime 0
wait 80
noclip
setviewpos -1152 -1200 24 270
wait 80
viewpos
screenshot stock_mirror_front
wait 4
setviewpos -1128 -1210 24 260
wait 64
screenshot stock_mirror_angle
wait 4
pt_info
echo PT_PROGRAM_COMPLETE
quit
