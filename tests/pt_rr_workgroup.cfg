// Brief fixed-camera comparison; quality is copied from the saved profile.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
wait 24
noclip
wait 2
setviewpos -1395 200 50 0
wait 40
viewpos
echo PT_PROGRAM_REFERENCE_A
set r_pathTracingProfile 1
wait 64
set r_pathTracingProfile 0
viewpos
screenshot rr_workgroup_stationary
wait 2
pt_info
echo PT_PROGRAM_COMPLETE
quit
