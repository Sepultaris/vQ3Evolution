// Same process, same settled camera, unchanged quality: off / on / off.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingDynamicOpaque 0
wait 24
noclip
wait 2
setviewpos -1395 200 50 0
wait 40
viewpos
echo PT_PROGRAM_REFERENCE_A
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
screenshot opaque_off
set r_pathTracingDynamicOpaque 1
wait 16
viewpos
echo PT_PROGRAM_OPTIMIZED_A
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
screenshot opaque_on
set r_pathTracingDynamicOpaque 0
wait 16
viewpos
echo PT_PROGRAM_REFERENCE_B
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
viewpos
wait 2
echo PT_PROGRAM_COMPLETE
quit
