// Fullscreen native menus omit 3D views: exercise successive 2D-only frames.
// The runner owns all graphics settings and the independent 45-second guard.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
wait 32
set developer 1
ui_testMenu setup
wait 24
screenshotJPEG ui_setup
wait 4
ui_testMenu graphics
wait 24
screenshotJPEG ui_graphics
wait 4
ui_testMenu close
wait 24
screenshotJPEG ui_gameplay
wait 4
echo PT_PROGRAM_COMPLETE
quit
