// Short non-timing validation: frame updates, cache switches and camera motion.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
set r_pathTracingBRDFReuse 1
set r_pathTracingLightLoop 1
set r_pathTracingEmitterGeometry 1
set r_pathTracingMaterialCache 1
wait 16
setviewpos -1616 200 24 0
wait 40
echo PT_CACHE_STATIONARY
pt_info
screenshotJPEG material_cache_validation_stationary
wait 4
set r_pathTracingMaterialCache 0
wait 12
set r_pathTracingMaterialCache 1
wait 12
setviewpos -1510 200 24 70
wait 40
echo PT_CACHE_MOVED
pt_info
screenshotJPEG material_cache_validation_moved
wait 4
echo PT_CACHE_COMPLETE
quit
