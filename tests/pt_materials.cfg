// Renderer-owned diagnostic geometry/materials, no asset package needed.
set con_notifytime 0
set r_pathTracingTestScene 1
vid_restart
wait 80
set cg_draw2D 0
set cg_drawGun 0
set r_pathTracingTemporalDebug 0
set r_pathTracingDebug 0
set r_pathTracingExposure 1
set r_pathTracingSamples 16
set r_pathTracingBounces 8
set r_pathTracingReference 1
noclip
setviewpos 10000 0 64 0
wait 150
viewpos
pt_info
screenshotJPEG pt_pbr_beauty
wait 4
set r_pathTracingDebug 1
wait 4
screenshotJPEG pt_pbr_diffuse
wait 4
set r_pathTracingDebug 2
wait 4
screenshotJPEG pt_pbr_specular
wait 4
set r_pathTracingDebug 3
wait 4
screenshotJPEG pt_pbr_emission
wait 4
set r_pathTracingDebug 4
wait 4
screenshotJPEG pt_pbr_normals
wait 4
set r_pathTracingDebug 5
wait 4
screenshotJPEG pt_pbr_orm
wait 4
set r_pathTracingDebug 6
wait 4
screenshotJPEG pt_pbr_dielectric
wait 4
set r_pathTracingDebug 0
set r_pathTracingReference 0
set r_pathTracingDenoise 1
set r_pathTracingTemporal 1
set r_pathTracingSamples 2
wait 30
screenshotJPEG pt_pbr_live
+right
wait 10
screenshotJPEG pt_pbr_turn
-right
wait 3
set r_pathTracingTestScene 0
quit
