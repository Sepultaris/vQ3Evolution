// Real mode changes via the existing settings/restart path; no fake OS events.
set fixedtime 0
set com_maxfps 60
set com_maxfpsUnfocused 60
set con_notifytime 0
set r_pathTracingReference 0
set r_pathTracingSamples 4
set r_pathTracingBounces 4
wait 240
echo PT_MODE_WINDOW
pt_info
r_fullscreen
set r_fullscreen 1
vid_restart
wait 240
echo PT_MODE_FULLSCREEN
pt_info
r_fullscreen
vk_testRecovery acquire-out-of-date
wait 240
echo PT_MODE_FULLSCREEN_RECOVERED
pt_info
r_fullscreen
set r_fullscreen 0
vid_restart
wait 240
echo PT_MODE_WINDOW_RETURN
pt_info
r_fullscreen
set r_customwidth 1280
set r_customheight 540
set r_mode -1
vid_restart
wait 240
echo PT_MODE_ULTRAWIDE
pt_info
r_fullscreen
devmap q3dm17
wait 240
echo PT_MODE_MAP_CHANGED
pt_info
disconnect
wait 120
echo PT_MODE_MENU
nvidia_info
echo PT_MODE_COMPLETE
quit
