// Isolated profile. Known stock-map flame with three additive animation layers.
devmap q3dm1
wait 80
set cg_draw2D 0
set cg_drawGun 0
set con_notifytime 0
set r_pathTracingReference 0
set r_pathTracingTemporalDebug 0
set r_pathTracingDenoise 1
set r_pathTracingTemporal 1
set r_pathTracingSamples 16
set r_pathTracingBounces 4
set r_pathTracingExposure 2
noclip
setviewpos 672 1400 70 270
wait 50
viewpos
pt_info
screenshotJPEG pt_flame_live_0
wait 17
screenshotJPEG pt_flame_live_1
wait 5
set r_pathTracingReference 1
wait 100
screenshotJPEG pt_flame_frozen_0
wait 100
screenshotJPEG pt_flame_frozen_1
wait 5
set r_pathTracingReference 0
quit
