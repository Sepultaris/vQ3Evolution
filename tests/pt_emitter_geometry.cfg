// A/B/B/A; saved quality unchanged, all actual attached decals retained.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
set r_pathTracingEmitterSearch 0
set r_pathTracingMapLightCull 0
set r_pathTracingBRDFReuse 1
set r_pathTracingAliasPDF 0
// Both compiled variants are warmed before any measurements.
set r_pathTracingEmitterGeometry 1
wait 16
set r_pathTracingEmitterGeometry 0
wait 12
setviewpos -1616 200 24 0
wait 40
viewpos
echo PT_PROGRAM_REFERENCE_A
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
set r_pathTracingEmitterGeometry 1
wait 12
echo PT_PROGRAM_OPTIMIZED_A
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
wait 12
echo PT_PROGRAM_OPTIMIZED_B
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
set r_pathTracingEmitterGeometry 0
wait 12
echo PT_PROGRAM_REFERENCE_B
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
wait 4
echo PT_PROGRAM_COMPLETE
pt_info
quit
