// Compile both exact runtime variants, then exit normally. Not an FPS test.
set fixedtime 16
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
set r_pathTracingBRDFReuse 1
set r_pathTracingMapLightCull 0
set r_pathTracingAliasPDF 0
set r_pathTracingEmitterGeometry 1
set r_pathTracingLightLoop 1
set r_pathTracingMaterialCache 1
set r_pathTracingCompactTransport 1
wait 16
set r_pathTracingCompactTransport 0
wait 12
pt_info
echo PT_COMPACT_WARMUP_COMPLETE
quit
