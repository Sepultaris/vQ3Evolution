// One externally bounded run. Graphics values come from the user's saved config.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
wait 120
setviewpos -1616 200 24 0
wait 60
viewpos
echo PT_SHADER_BASELINE_A
set r_pathTracingProfile 1
wait 80
set r_pathTracingProfile 0
echo PT_SHADER_INSTRUMENTED
set r_pathTracingShaderProfile 1
set r_pathTracingProfile 1
wait 128
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
wait 16
echo PT_SHADER_BASELINE_B
set r_pathTracingProfile 1
wait 80
set r_pathTracingProfile 0
wait 4
pt_info
echo PT_SHADER_COMPLETE
quit
