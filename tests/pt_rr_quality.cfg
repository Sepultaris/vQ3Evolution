// Saved quality; explicit RR/sample overrides belong to the benchmark manifest.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
wait 80
setviewpos -1510 200 24 0
wait 64
viewpos
echo PT_PROGRAM_REFERENCE_A
set r_pathTracingProfile 1
wait 96
set r_pathTracingProfile 0
screenshotJPEG rr_stationary
wait 4
+right
wait 40
-right
screenshotJPEG rr_motion
wait 4
wait 48
screenshotJPEG rr_settled
wait 4
pt_info
echo PT_PROGRAM_COMPLETE
quit
