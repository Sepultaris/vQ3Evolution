// Fixed camera, saved quality, no warmup pipeline switches or diagnostic shaders.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
set r_pathTracingShaderProfile 0
set r_pathTracingCompactTransport 1
// Allow the loopback client to receive its first snapshot before teleporting.
wait 80
setviewpos -1510 200 24 0
wait 96
viewpos
echo PT_PROGRAM_REFERENCE_A
set r_pathTracingProfile 1
wait 112
set r_pathTracingProfile 0
viewpos
screenshotJPEG query_state
wait 4
echo PT_PROGRAM_COMPLETE
pt_info
quit
