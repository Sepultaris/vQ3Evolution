// Renderer-owned geometry; no asset overrides or quality changes.
set fixedtime 16
set con_notifytime 0
set r_pathTracingProfile 0
wait 80
set r_pathTracingTestScene 3
vid_restart
wait 40
noclip
setviewpos 10000 0 38 0
wait 48
viewpos
echo PT_EFFECT_INTERSECTIONS
screenshot effect_intersections
wait 4
set r_pathTracingDebug 4
wait 12
screenshot effect_intersections_normals
wait 4
set r_pathTracingDebug 0
wait 32
pt_info
echo PT_PROGRAM_COMPLETE
quit
