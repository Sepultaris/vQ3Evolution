echo PT_RESTART_BEGIN_5
vid_restart
wait 80
pt_info
echo PT_RESTART_END_5
echo PT_RESTART_BEGIN_6
vid_restart
wait 80
pt_info
echo PT_RESTART_END_6
echo PT_RESTART_BEGIN_7
vid_restart
wait 80
pt_info
echo PT_RESTART_END_7
echo PT_RESTART_BEGIN_8
vid_restart
wait 80
pt_info
echo PT_RESTART_END_8
echo PT_RESTART_BEGIN_9
vid_restart
wait 80
pt_info
