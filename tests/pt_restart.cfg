// Repeated device recreation with the real path tracer and retained game data.
set fixedtime 16
set com_maxfps 0
set com_maxfpsUnfocused 0
set cg_draw2D 0
set cg_drawGun 1
set con_notifytime 0
set r_pathTracingReference 0
